<html lang="es">

<head>
    <title>
        Gestión de escuela | Clase 1 de JS
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <link rel="stylesheet" href="CSS/estilos.css">
</head>

<body>
    <header>
        <h1> Gestión de Escuela </h1>
        <p class="subtitulo"> Clase 1: Fundamentos de JS</p>
    </header>

    <main> 
        <section class="tarjeta">       
            <h2>Cargar alumno</h2>
            <form id="formAlumno" novalidate>

                <div class="campo">
                    <label for="inputNombre">Nombre del alumno</label>
                    <input type="text" id="inputNombre"
                    placeholder="Ej: Adolfo Vera"
                    autocomplete="off">
                </div>

                <div class="campo">
                    <label for="selectMateria">Materia</label>
                    <select id="selectMateria"></select>
                </div>

                <div class="campo">
                    <label for="inputNota">Nota (1 a 10)</label>
                    <input type="number", id="inputNota" min="1" max="10"
                    step="1" placeholder="Ej: 8">
                </div>

                <button type="submit">Agregar alumno</button>
            </form> 
            <p id="mensaje" class="mensaje"> </p>     
        </section>

        <section class = "tarjeta">
             <h2> Listado de alumnos </h2>
            <div class="campo, campo-filtro">
                <!-- for permite linkear el evento focus al elemento con id del mismo nombre-->
                <label for="filtroMateria">Filtrar por Materia</label>
                <select id="filtroMateria"></select>
                <!-- Seccion: 3 Tabla -->
                 <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Materia</th>
                            <th>Nota</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTable"></tbody>
                 </table>
            </div>
        </section>

            <!-- Seccion 4 : Tarejta-->

        <section class = "tarjeta estadisticas">
            <div class="stat">
                <span class="stat-numero" id="totalAlumnos">12
                </span>
                Alumnos
            </div>
            <div class = "span">
                <span class = "stat-numero" id = "promedioGeneral">4
                </span>
                Promedio
            </div>
            <div class = "span">
                <span class = "stat-numero" id = "totalAprobados">5 
                </span>
                Aprobado
            </div>
        </section>
    </main>
    <footer>
        <p>Abri la consola del navegador con <kbd> F12 </kbd> para ver los mensajes de la clase</p>
    </footer>

    <script src="scripts/app.js"> </script>
    
</body>


</html>
